name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'   # 每日 UTC 2:17 用已跟踪快照检查构建

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22.19.0', cache: npm }
      - run: npm ci
      # 全量 topic 扫描由线上 Worker Cron 定期执行；CI 使用仓库内已跟踪的分片快照，
      # 避免每次构建重新扫描历史仓库，并确保没有单个静态资源接近平台大小上限。
      - run: npm test        # 含 lint + typecheck + build + 集成测试
      - name: Deploy Worker
        if: github.event_name != 'schedule'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.123.0'
          command: deploy --config dist/server/wrangler.json
      - name: Apply D1 migrations
        if: github.event_name != 'schedule'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.123.0'
          command: d1 migrations apply dsh-plugin-hub-visits --remote --config dist/server/wrangler.json
      - name: Notify search engines (IndexNow)
        if: github.event_name != 'schedule'
        run: node scripts/indexnow-ping.mjs
        env:
          # 可选：配置 BAIDU_PUSH_TOKEN secret 后自动启用百度主动推送
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
